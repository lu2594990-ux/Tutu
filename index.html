<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>兔的小工具箱 - 酒馆正则编辑器</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  background: #F5F5F7;
  color: #1D1D1F;
  padding: 20px 16px 60px;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.container {
  max-width: 680px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 32px;
}

.header h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.header p {
  font-size: 17px;
  color: #86868B;
  font-weight: 400;
}

.mode-switch {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  background: #fff;
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.mode-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  color: #86868B;
}

.mode-btn.active {
  background: #1D1D1F;
  color: #fff;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.step-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: #1D1D1F;
  color: #fff;
  border-radius: 50%;
  font-size: 15px;
  font-weight: 600;
  flex-shrink: 0;
}

.step-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.step-desc {
  font-size: 15px;
  color: #86868B;
  margin-bottom: 20px;
  margin-left: 44px;
}

.upload-area {
  border: 3px dashed #E5E5EA;
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #FAFAFA;
}

.upload-area:hover {
  border-color: #1D1D1F;
  background: #fff;
}

.upload-area.dragover {
  border-color: #1D1D1F;
  background: #F0F0F0;
}

.upload-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.upload-text {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 8px;
}

.upload-hint {
  font-size: 14px;
  color: #86868B;
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 14px;
  border: 2px solid #E5E5EA;
  border-radius: 14px;
  font-size: 14px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  background: #FAFAFA;
}

textarea:focus {
  border-color: #1D1D1F;
  background: #fff;
}

.btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  letter-spacing: -0.2px;
}

.btn-primary {
  background: #1D1D1F;
  color: #fff;
}

.btn-primary:active {
  transform: scale(0.98);
  background: #000;
}

.btn-secondary {
  background: #F5F5F7;
  color: #1D1D1F;
  margin-top: 12px;
  border: 2px solid #E5E5EA;
}

.btn-secondary:active {
  transform: scale(0.98);
  background: #E5E5EA;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.form-section {
  display: none;
}

.form-section.active {
  display: block;
}

.section-block {
  border: 2px solid #E5E5EA;
  border-radius: 14px;
  margin-bottom: 16px;
  overflow: hidden;
  background: #FAFAFA;
}

.section-header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  background: #fff;
  transition: background 0.15s;
  user-select: none;
}

.section-header:active {
  background: #F5F5F7;
}

.section-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.2px;
}

.section-toggle {
  font-size: 20px;
  color: #86868B;
  transition: transform 0.25s;
}

.section-block.open .section-toggle {
  transform: rotate(180deg);
}

.section-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  background: #fff;
}

.section-block.open .section-content {
  max-height: 10000px;
}

.section-inner {
  padding: 4px 20px 20px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group-pair {
  background: #F5F5F7;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid #E5E5EA;
  position: relative;
}

.form-group-header {
  font-size: 14px;
  font-weight: 600;
  color: #1D1D1F;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #E5E5EA;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.delete-btn {
  background: #fff0f0;
  color: #c33;
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.delete-btn:active {
  transform: scale(0.95);
  background: #ffe0e0;
}

.add-btn {
  width: 100%;
  padding: 12px;
  background: #1D1D1F;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 12px;
}

.add-btn:active {
  transform: scale(0.98);
  background: #000;
}

.form-label {
  display: block;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #1D1D1F;
  letter-spacing: -0.1px;
}

.form-input, .form-textarea {
  width: 100%;
  padding: 13px 14px;
  border: 2px solid #E5E5EA;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  transition: all 0.2s;
  font-family: inherit;
  background: #FAFAFA;
}

.form-input:focus, .form-textarea:focus {
  border-color: #1D1D1F;
  background: #fff;
}

.form-textarea {
  min-height: 80px;
  resize: vertical;
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 14px;
}

.success-msg {
  display: none;
  background: #1D1D1F;
  color: #fff;
  padding: 14px 18px;
  border-radius: 12px;
  margin-top: 12px;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
}

.success-msg.show {
  display: block;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.info-badge {
  display: inline-block;
  background: #F5F5F7;
  color: #1D1D1F;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  margin: 4px 6px 4px 0;
  border: 1px solid #E5E5EA;
}

.regex-info {
  background: #FAFAFA;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
  border: 1px solid #E5E5EA;
}

.regex-info-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  color: #1D1D1F;
}

input[type="file"] {
  display: none;
}

.preview-area {
  background: #FAFAFA;
  border: 2px solid #E5E5EA;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  min-height: 100px;
}

.preview-title {
  font-size: 14px;
  font-weight: 600;
  color: #86868B;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tab-group {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  background: #F5F5F7;
  padding: 6px;
  border-radius: 12px;
}

.tab-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  color: #86868B;
}

.tab-btn.active {
  background: #fff;
  color: #1D1D1F;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>兔的小工具箱</h1>
    <p>酒馆正则 & HTML配置一键替换</p>
  </div>

  <div class="mode-switch">
    <button class="mode-btn active" onclick="switchMode('regex')" id="regexModeBtn">
      🎯 酒馆正则模式
    </button>
    <button class="mode-btn" onclick="switchMode('html')" id="htmlModeBtn">
      🔧 HTML替换模式
    </button>
  </div>

  <div id="regexMode">
    <div class="card" id="regexUploadCard">
      <div class="step-header">
        <span class="step-num">1</span>
        <span class="step-title">导入正则JSON</span>
      </div>
      <div class="step-desc">从酒馆导出的正则文件（.json格式）</div>

      <div class="upload-area" id="regexUploadArea" onclick="document.getElementById('regexFileInput').click()">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击选择文件或拖拽到这里</div>
        <div class="upload-hint">支持 .json 格式</div>
      </div>
      <input type="file" id="regexFileInput" accept=".json" onchange="handleRegexFile(event)">
    </div>

    <div class="card form-section" id="regexEditCard">
      <div class="step-header">
        <span class="step-num">2</span>
        <span class="step-title">编辑配置</span>
      </div>
      <div class="step-desc">修改 replaceString 里的配置内容</div>

      <div class="regex-info" id="regexInfoDisplay"></div>

      <div class="tab-group">
        <button class="tab-btn active" onclick="switchRegexTab('edit')">✏️ 编辑配置</button>
        <button class="tab-btn" onclick="switchRegexTab('preview')">👁️ 预览效果</button>
      </div>

      <div class="tab-content active" id="regexEditTab">
        <div id="regexFormFields"></div>
      </div>

      <div class="tab-content" id="regexPreviewTab">
        <div class="preview-title">实时预览</div>
        <div class="preview-area" id="regexPreviewArea"></div>
      </div>

      <button class="btn btn-primary" onclick="generateRegexJson()">生成新JSON</button>
    </div>

    <div class="card form-section" id="regexOutputCard">
      <div class="step-header">
        <span class="step-num">3</span>
        <span class="step-title">下载正则JSON</span>
      </div>
      <div class="step-desc">可以直接导入酒馆使用</div>
      <button class="btn btn-primary" onclick="downloadRegexJson()">📥 下载 JSON 文件</button>
      <button class="btn btn-secondary" onclick="resetRegex()">重新开始</button>
      <div class="success-msg" id="regexSuccessMsg">JSON 已生成！</div>
    </div>
  </div>

  <div id="htmlMode" style="display: none;">
    <div class="card">
      <div class="step-header">
        <span class="step-num">1</span>
        <span class="step-title">粘贴代码</span>
      </div>
      <div class="step-desc">把完整的HTML代码粘贴到下方</div>
      <textarea id="inputCode" placeholder="粘贴你的完整HTML代码..."></textarea>
      <button class="btn btn-primary" onclick="parseCode()">解析配置</button>
    </div>

    <div class="card form-section" id="formSection">
      <div class="step-header">
        <span class="step-num">2</span>
        <span class="step-title">编辑配置</span>
      </div>
      <div class="step-desc">修改你想要替换的内容</div>
      <div id="formFields"></div>
      <button class="btn btn-primary" onclick="generateCode()">生成新代码</button>
    </div>

    <div class="card form-section" id="outputSection">
      <div class="step-header">
        <span class="step-num">3</span>
        <span class="step-title">复制代码</span>
      </div>
      <div class="step-desc">配置已更新，点击复制完整代码</div>

<iframe id="previewFrame" style="width:100%;height:500px;border:2px solid #E5E5EA;border-radius:12px;margin-bottom:16px;background:#fff;"></iframe>

      <button class="btn btn-primary" onclick="copyCode()">一键复制</button>
      <button class="btn btn-secondary" onclick="reset()">重新开始</button>
      <div class="success-msg" id="successMsg">复制成功</div>
    </div>
  </div>
</div>

<script>
let currentMode = 'regex';
let regexData = null;
let regexOriginalHtml = '';
let regexParsedConfig = {};
let regexGeneratedJson = '';
let configVarName = '';
let configType = '';

let originalCode = '';
let parsedConfig = {};
let generatedCode = '';

function switchMode(mode) {
  currentMode = mode;
  if (mode === 'regex') {
    document.getElementById('regexMode').style.display = 'block';
    document.getElementById('htmlMode').style.display = 'none';
    document.getElementById('regexModeBtn').classList.add('active');
    document.getElementById('htmlModeBtn').classList.remove('active');
  } else {
    document.getElementById('regexMode').style.display = 'none';
    document.getElementById('htmlMode').style.display = 'block';
    document.getElementById('regexModeBtn').classList.remove('active');
    document.getElementById('htmlModeBtn').classList.add('active');
  }
}

const regexUploadArea = document.getElementById('regexUploadArea');
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  regexUploadArea.addEventListener(eventName, preventDefaults, false);
});

function preventDefaults(e) {
  e.preventDefault();
  e.stopPropagation();
}

['dragenter', 'dragover'].forEach(eventName => {
  regexUploadArea.addEventListener(eventName, () => {
    regexUploadArea.classList.add('dragover');
  }, false);
});

['dragleave', 'drop'].forEach(eventName => {
  regexUploadArea.addEventListener(eventName, () => {
    regexUploadArea.classList.remove('dragover');
  }, false);
});

regexUploadArea.addEventListener('drop', (e) => {
  const files = e.dataTransfer.files;
  if (files.length > 0) {
    handleRegexFileContent(files[0]);
  }
}, false);

function handleRegexFile(event) {
  const file = event.target.files[0];
  if (file) {
    handleRegexFileContent(file);
  }
}

function handleRegexFileContent(file) {
  if (!file.name.endsWith('.json')) {
    alert('请选择 .json 文件');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      regexData = JSON.parse(e.target.result);
      if (!regexData.findRegex || regexData.replaceString === undefined) {
        alert('这不是有效的酒馆正则格式');
        return;
      }
      regexOriginalHtml = regexData.replaceString;
      parseRegexData();
      displayRegexInfo();
      if (regexParsedConfig && Object.keys(regexParsedConfig).length > 0) {
        generateRegexForm();
      } else {
        alert('replaceString 里没有找到 window.CONFIG，无法解析配置');
        return;
      }
      document.getElementById('regexEditCard').classList.add('active');
      document.getElementById('regexEditCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      alert('JSON 解析失败: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function parseRegexData() {
  const replaceStr = regexData.replaceString;
  const configMatch = replaceStr.match(/window\.(\w*CONFIG)\s*=\s*(\{[\s\S]*?\n\}\s*;)/);
  if (configMatch) {
    try {
      const configCode = configMatch[2].replace(/\}\s*;$/, '}');
      regexParsedConfig = eval('(' + configCode + ')');
      configVarName = configMatch[1];
      if (regexParsedConfig.episodes && Array.isArray(regexParsedConfig.episodes)) {
        configType = 'podcast';
      } else if (regexParsedConfig.stories || regexParsedConfig.post) {
        configType = 'instagram';
      } else {
        configType = 'instagram';
      }
    } catch (e) {
      regexParsedConfig = {};
      console.error('配置解析失败:', e);
    }
  } else {
    regexParsedConfig = {};
  }
}

function displayRegexInfo() {
  const infoDiv = document.getElementById('regexInfoDisplay');
  let html = '<div class="regex-info-title">📋 正则信息</div>';
  html += `<div><strong>名称:</strong> ${regexData.scriptName || '未命名'}</div>`;
  html += '<div style="margin-top: 8px;">';
  html += `<span class="info-badge">${regexData.disabled ? '❌ 已禁用' : '✅ 已启用'}</span>`;
  html += `<span class="info-badge">${regexData.markdownOnly ? '📝 仅Markdown' : '🌐 全部'}</span>`;
  html += `<span class="info-badge">${regexData.runOnEdit ? '⚡ 编辑时运行' : '💬 发送时运行'}</span>`;
  if (regexData.minDepth !== null && regexData.minDepth !== undefined) {
    html += `<span class="info-badge">最小深度: ${regexData.minDepth}</span>`;
  }
  if (regexData.maxDepth !== null && regexData.maxDepth !== undefined) {
    html += `<span class="info-badge">最大深度: ${regexData.maxDepth}</span>`;
  }
  html += '</div>';
  infoDiv.innerHTML = html;
}

function switchRegexTab(tab) {
  const tabs = document.querySelectorAll('#regexEditCard .tab-btn');
  const contents = document.querySelectorAll('#regexEditCard .tab-content');
  tabs.forEach(t => t.classList.remove('active'));
  contents.forEach(c => c.classList.remove('active'));
  if (tab === 'edit') {
    tabs[0].classList.add('active');
    document.getElementById('regexEditTab').classList.add('active');
  } else {
    tabs[1].classList.add('active');
    document.getElementById('regexPreviewTab').classList.add('active');
    updateRegexPreview();
  }
}

function collectConfig(baseConfig, scope) {
  const newConfig = JSON.parse(JSON.stringify(baseConfig));


  if (newConfig.stories) newConfig.stories = [];
  if (newConfig.post && newConfig.post.images) newConfig.post.images = [];

  if (newConfig.episodes) newConfig.episodes = [];
  if (newConfig.reviews) newConfig.reviews = [];


  scope.querySelectorAll('[data-key]').forEach(input => {
    const key = input.dataset.key;
    const value = input.value.trim();

    if (key.startsWith('stories[')) {
      const match = key.match(/stories\[(\d+)\]\.(img|name)/);
      if (match) {
        const idx = parseInt(match[1]);
        const field = match[2];
        if (!newConfig.stories[idx]) {
          newConfig.stories[idx] = { img: '', name: '' };
        }
        newConfig.stories[idx][field] = value;
      }
      return;
    }

    if (key.startsWith('post.images[')) {
      const match = key.match(/post\.images\[(\d+)\]/);
      if (match) {
        const idx = parseInt(match[1]);
        if (value) {
          newConfig.post.images[idx] = value;
        }
      }
      return;
    }

    if (key.startsWith('episodes[')) {
      const match = key.match(/episodes\[(\d+)\]\.(num|title|desc|thumb|duration)/);
      if (match) {
        const idx = parseInt(match[1]);
        const field = match[2];
        if (!newConfig.episodes[idx]) {
          newConfig.episodes[idx] = { num: '', title: '', desc: '', thumb: '', duration: '' };
        }
        newConfig.episodes[idx][field] = value;
      }
      return;
    }

    if (key.startsWith('reviews[')) {
      const match = key.match(/reviews\[(\d+)\]\.(title|time|stars|user|body)/);
      if (match) {
        const idx = parseInt(match[1]);
        const field = match[2];
        if (!newConfig.reviews[idx]) {
          newConfig.reviews[idx] = { title: '', time: '', stars: 0, user: '', body: '' };
        }
        newConfig.reviews[idx][field] = field === 'stars' ? (Number(value) || 0) : value;
      }
      return;
    }


    const keys = key.split(/[\.\[\]]/).filter(k => k);
    let target = newConfig;
    for (let i = 0; i < keys.length - 1; i++) {
      const k = keys[i];
      if (!target[k]) target[k] = isNaN(keys[i + 1]) ? {} : [];
      target = target[k];
    }
    const lastKey = keys[keys.length - 1];
    if (!isNaN(value) && value !== '') {
      target[lastKey] = Number(value);
    } else {
      target[lastKey] = value;
    }
  });

if (newConfig.post && newConfig.post.images) {
    newConfig.post.images = newConfig.post.images.filter(img => img && img.trim());
  }
  if (newConfig.stories) {
    newConfig.stories = newConfig.stories.filter(s => s && (s.img || s.name));
  }
  if (newConfig.episodes) {
    newConfig.episodes = newConfig.episodes.filter(ep => ep && (ep.num || ep.title));
  }
  if (newConfig.reviews) {
    newConfig.reviews = newConfig.reviews.filter(r => r && (r.title || r.body));
  }

if (newConfig.bubble) {
    Object.keys(newConfig.bubble).forEach(k => {
      if (!newConfig.bubble[k] || newConfig.bubble[k].trim() === '') {
        delete newConfig.bubble[k];
      }
    });
    // 如果 bubble 里所有字段都删光了，就把整个 bubble 对象也删掉
    if (Object.keys(newConfig.bubble).length === 0) {
      delete newConfig.bubble;
    }
  }
  return newConfig;
}

function buildConfigStr(config) {
  return 'window.' + configVarName + ' = ' + JSON.stringify(config, null, 2)
    .replace(/"(\w+)":/g, '$1:')
    .replace(/: "([^"]*)"/g, ": '$1'")
    .replace(/\n {2}/g, '\n  ')
    + ';';
}

function updateRegexPreview() {
  const newConfig = collectConfig(regexParsedConfig, document.getElementById('regexFormFields'));
  const configStr = buildConfigStr(newConfig);
  let previewHtml = regexOriginalHtml.replace(
    new RegExp('window\\.' + configVarName + '\\s*=\\s*\\{[\\s\\S]*?\\n\\}\\s*;'),
    configStr
  );
  previewHtml = previewHtml.replace(/\$1/g, '这是状态栏文本示例');

document.getElementById('regexPreviewArea').innerHTML = '<iframe srcdoc="' + previewHtml.replace(/"/g, '&quot;') + '" style="width:100%;height:500px;border:none;border-radius:8px;"></iframe>';

}

function generateRegexForm() {
  buildForm(document.getElementById('regexFormFields'), regexParsedConfig);
}

function generateRegexJson() {
  const newConfig = collectConfig(regexParsedConfig, document.getElementById('regexFormFields'));
  const configStr = buildConfigStr(newConfig);
  regexData.replaceString = regexOriginalHtml.replace(
    new RegExp('window\\.' + configVarName + '\\s*=\\s*\\{[\\s\\S]*?\\n\\}\\s*;'),
    configStr
  );
  regexGeneratedJson = JSON.stringify(regexData, null, 2);
  document.getElementById('regexOutputCard').classList.add('active');
  document.getElementById('regexOutputCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  const msg = document.getElementById('regexSuccessMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

function downloadRegexJson() {
  const blob = new Blob([regexGeneratedJson], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const filename = (regexData.scriptName || 'regex').replace(/[^a-zA-Z0-9\u4e00-\u9fa5_\-\[\]【】]/g, '_') + '.json';
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetRegex() {
  regexData = null;
  regexOriginalHtml = '';
  regexParsedConfig = {};
  regexGeneratedJson = '';
  configVarName = '';
  configType = '';
  document.getElementById('regexFileInput').value = '';
  document.getElementById('regexEditCard').classList.remove('active');
  document.getElementById('regexOutputCard').classList.remove('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function parseCode() {
  const input = document.getElementById('inputCode').value.trim();
  if (!input) {
    alert('请先粘贴代码');
    return;
  }
  const configMatch = input.match(/window\.(\w*CONFIG)\s*=\s*(\{[\s\S]*?\n\}\s*;)/);
  if (!configMatch) {
    alert('未找到配置区（需要 window.CONFIG 格式）');
    return;
  }
  originalCode = input;
  configVarName = configMatch[1];
  try {
    const configCode = configMatch[2].replace(/\}\s*;$/, '}');
    parsedConfig = eval('(' + configCode + ')');
    if (parsedConfig.episodes && Array.isArray(parsedConfig.episodes)) {
      configType = 'podcast';
    } else if (parsedConfig.stories || parsedConfig.post) {
      configType = 'instagram';
    } else {
      configType = 'instagram';
    }
    buildForm(document.getElementById('formFields'), parsedConfig);
    document.getElementById('formSection').classList.add('active');
    document.getElementById('formSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    alert('配置解析失败: ' + e.message);
    console.error(e);
  }
}

function inferType(value) {
  if (typeof value === 'string' && value.length > 60) return 'textarea';
  return 'text';
}

function createFormGroup(key, label, type, value) {
  const fg = document.createElement('div');
  fg.className = 'form-group';
  const lbl = document.createElement('label');
  lbl.className = 'form-label';
  lbl.textContent = label;
  const input = document.createElement(type === 'textarea' ? 'textarea' : 'input');
  input.className = type === 'textarea' ? 'form-textarea' : 'form-input';
  input.dataset.key = key;
  if (type !== 'textarea') input.type = 'text';
  input.value = value !== undefined && value !== null ? String(value) : '';
  fg.appendChild(lbl);
  fg.appendChild(input);
  return fg;
}

function generateCode() {
  const newConfig = collectConfig(parsedConfig, document.getElementById('formFields'));
  const configStr = buildConfigStr(newConfig);
  generatedCode = originalCode.replace(
    new RegExp('window\\.' + configVarName + '\\s*=\\s*\\{[\\s\\S]*?\\n\\}\\s*;'),
    configStr
  );
  document.getElementById('outputSection').classList.add('active');
  document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('previewFrame').srcdoc = generatedCode;  // ◀ 移到这里
}



function copyCode() {
  const temp = document.createElement('textarea');
  temp.value = generatedCode;
  temp.style.position = 'fixed';
  temp.style.opacity = '0';
  document.body.appendChild(temp);
  temp.select();
  try {
    document.execCommand('copy');
    const msg = document.getElementById('successMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  } catch (err) {
    alert('复制失败，请手动复制');
  }
  document.body.removeChild(temp);
}

function reset() {
  originalCode = '';
  parsedConfig = {};
  generatedCode = '';
  configVarName = '';
  configType = '';
  document.getElementById('inputCode').value = '';
  document.getElementById('formSection').classList.remove('active');
  document.getElementById('outputSection').classList.remove('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
