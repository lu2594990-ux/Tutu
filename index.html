<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>兔的小工具箱 - 正则编辑器</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  background: #F5F5F7;
  color: #1D1D1F;
  padding: 20px 16px 60px;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.container {
  max-width: 680px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 32px;
}

.header h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.header p {
  font-size: 17px;
  color: #86868B;
  font-weight: 400;
}

.mode-switch {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  background: #fff;
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.mode-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  color: #86868B;
}

.mode-btn.active {
  background: #1D1D1F;
  color: #fff;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.step-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: #1D1D1F;
  color: #fff;
  border-radius: 50%;
  font-size: 15px;
  font-weight: 600;
  flex-shrink: 0;
}

.step-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.step-desc {
  font-size: 15px;
  color: #86868B;
  margin-bottom: 20px;
  margin-left: 44px;
}

.upload-area {
  border: 3px dashed #E5E5EA;
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #FAFAFA;
}

.upload-area:hover {
  border-color: #1D1D1F;
  background: #fff;
}

.upload-area.dragover {
  border-color: #1D1D1F;
  background: #F0F0F0;
}

.upload-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.upload-text {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 8px;
}

.upload-hint {
  font-size: 14px;
  color: #86868B;
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 14px;
  border: 2px solid #E5E5EA;
  border-radius: 14px;
  font-size: 14px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  background: #FAFAFA;
}

textarea:focus {
  border-color: #1D1D1F;
  background: #fff;
}

.btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  letter-spacing: -0.2px;
}

.btn-primary {
  background: #1D1D1F;
  color: #fff;
}

.btn-primary:active {
  transform: scale(0.98);
  background: #000;
}

.btn-secondary {
  background: #F5F5F7;
  color: #1D1D1F;
  margin-top: 12px;
  border: 2px solid #E5E5EA;
}

.btn-secondary:active {
  transform: scale(0.98);
  background: #E5E5EA;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.form-section {
  display: none;
}

.form-section.active {
  display: block;
}

.section-block {
  border: 2px solid #E5E5EA;
  border-radius: 14px;
  margin-bottom: 16px;
  overflow: hidden;
  background: #FAFAFA;
}

.section-header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  background: #fff;
  transition: background 0.15s;
  user-select: none;
}

.section-header:active {
  background: #F5F5F7;
}

.section-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.2px;
}

.section-toggle {
  font-size: 20px;
  color: #86868B;
  transition: transform 0.25s;
}

.section-block.open .section-toggle {
  transform: rotate(180deg);
}

.section-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  background: #fff;
}

.section-block.open .section-content {
  max-height: 10000px;
}

.section-inner {
  padding: 4px 20px 20px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group-pair {
  background: #F5F5F7;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid #E5E5EA;
  position: relative;
}

/* —— 置顶联系人 / 信息列表：单项折叠 —— */
.pinned-config-item,
.message-config-item {
  padding: 0;
  overflow: hidden;
}

.contact-collapse-header {
  padding: 14px 16px;
  background: #fff;
  border-bottom: 1px solid #E5E5EA;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

.contact-collapse-title-wrap {
  flex: 1;
  min-width: 0;
}

.contact-collapse-title {
  font-size: 15px;
  font-weight: 700;
  color: #1D1D1F;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.contact-collapse-subtitle {
  margin-top: 4px;
  font-size: 12px;
  color: #86868B;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.contact-collapse-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.contact-collapse-toggle {
  font-size: 18px;
  color: #86868B;
  transition: transform 0.2s;
}

.pinned-config-item.open .contact-collapse-toggle,
.message-config-item.open .contact-collapse-toggle {
  transform: rotate(180deg);
}

.contact-collapse-body {
  display: none;
  padding: 16px;
  background: #F5F5F7;
}

.pinned-config-item.open .contact-collapse-body,
.message-config-item.open .contact-collapse-body {
  display: block;
}

.form-group-header {
  font-size: 14px;
  font-weight: 600;
  color: #1D1D1F;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #E5E5EA;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.delete-btn {
  background: #fff0f0;
  color: #c33;
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.delete-btn:active {
  transform: scale(0.95);
  background: #ffe0e0;
}

.add-btn {
  width: 100%;
  padding: 12px;
  background: #1D1D1F;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 12px;
}

.add-btn:active {
  transform: scale(0.98);
  background: #000;
}

.form-label {
  display: block;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #1D1D1F;
  letter-spacing: -0.1px;
}

.form-input, .form-textarea {
  width: 100%;
  padding: 13px 14px;
  border: 2px solid #E5E5EA;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  transition: all 0.2s;
  font-family: inherit;
  background: #FAFAFA;
}

.form-input:focus, .form-textarea:focus {
  border-color: #1D1D1F;
  background: #fff;
}

.form-textarea {
  min-height: 80px;
  resize: vertical;
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 14px;
}

.success-msg {
  display: none;
  background: #1D1D1F;
  color: #fff;
  padding: 14px 18px;
  border-radius: 12px;
  margin-top: 12px;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
}

.success-msg.show {
  display: block;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.info-badge {
  display: inline-block;
  background: #F5F5F7;
  color: #1D1D1F;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  margin: 4px 6px 4px 0;
  border: 1px solid #E5E5EA;
}

.choice-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.choice-btn {
  flex: 1;
  min-width: 86px;
  padding: 11px 12px;
  border: 2px solid #E5E5EA;
  border-radius: 11px;
  background: #FAFAFA;
  color: #1D1D1F;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}

.choice-btn.active {
  background: #1D1D1F;
  color: #fff;
  border-color: #1D1D1F;
}

.choice-btn:active {
  transform: scale(0.96);
}
/* —— 播放器滑条控件 —— */
.player-slider-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.player-range {
  flex: 1;
  height: 32px;
  accent-color: #1D1D1F;
}

.player-range-value {
  min-width: 74px;
  text-align: right;
  font-size: 13px;
  font-weight: 700;
  color: #555;
  font-variant-numeric: tabular-nums;
}

/* —— 字体注入器 —— */
.font-inject-panel {
  background: #F5F5F7;
  border: 2px solid #E5E5EA;
  border-radius: 14px;
  padding: 16px;
  margin: 0 0 16px;
}

.font-inject-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 6px;
  color: #1D1D1F;
}

.font-inject-desc {
  font-size: 13px;
  color: #86868B;
  margin-bottom: 12px;
  line-height: 1.45;
}

.font-inject-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.font-toggle-btn,
.font-preset-btn {
  border: 2px solid #E5E5EA;
  background: #fff;
  color: #1D1D1F;
  border-radius: 11px;
  padding: 10px 12px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}

.font-toggle-btn.active,
.font-preset-btn.active {
  background: #1D1D1F;
  color: #fff;
  border-color: #1D1D1F;
}

.font-toggle-btn:active,
.font-preset-btn:active {
  transform: scale(0.96);
}

.font-preset-btn {
  flex: 1;
  min-width: 130px;
}

.font-inject-note {
  margin-top: 10px;
  font-size: 12px;
  color: #C2410C;
  background: #FFF7ED;
  border: 1px solid #FED7AA;
  border-radius: 9px;
  padding: 8px 10px;
}

.regex-info {
  background: #FAFAFA;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
  border: 1px solid #E5E5EA;
}

.regex-info-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  color: #1D1D1F;
}

input[type="file"] {
  display: none;
}

.preview-area {
  background: #FAFAFA;
  border: 2px solid #E5E5EA;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  min-height: 100px;
}

.preview-title {
  font-size: 14px;
  font-weight: 600;
  color: #86868B;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tab-group {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  background: #F5F5F7;
  padding: 6px;
  border-radius: 12px;
}

.tab-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  color: #86868B;
}

.tab-btn.active {
  background: #fff;
  color: #1D1D1F;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.placeholder-hint {
  font-size: 12px;
  color: #C2410C;
  background: #FFF7ED;
  border: 1px solid #FED7AA;
  border-radius: 8px;
  padding: 6px 10px;
  margin-top: 6px;
  line-height: 1.4;
}

/* —— toast 顶部提示 —— */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: #1D1D1F;
  color: #fff;
  padding: 14px 24px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  z-index: 9999;
  opacity: 0;
  transition: transform 0.3s cubic-bezier(0.34,1.4,0.64,1), opacity 0.3s;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* —— 全部展开/折叠 按钮 —— */
.expand-all-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.expand-all-bar button {
  flex: 1;
  padding: 10px;
  border: 2px solid #E5E5EA;
  border-radius: 10px;
  background: #fff;
  color: #1D1D1F;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.expand-all-bar button:active {
  transform: scale(0.98);
  background: #F5F5F7;
}

/* —— 悬浮智能按钮：预览 / 回去编辑 来回切 —— */
.preview-fab {
  position: fixed;
  right: 18px;
  bottom: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #1D1D1F;
  color: #fff;
  border: none;
  box-shadow: 0 6px 20px rgba(0,0,0,0.28);
  cursor: pointer;
  z-index: 9998;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  line-height: 1;
  transition: transform 0.15s, opacity 0.25s, background 0.2s;
}
.preview-fab span {
  font-size: 10px;
  font-weight: 600;
  margin-top: 2px;
}
.preview-fab.show {
  display: flex;
}
.preview-fab:active {
  transform: scale(0.92);
}
/* 处于"回去编辑"状态时换个浅色，方便区分 */
.preview-fab.back-mode {
  background: #fff;
  color: #1D1D1F;
  border: 2px solid #E5E5EA;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
}

/* —— 心情表情包库优化版 —— */
.mood-library-config-item {
  padding: 0;
  overflow: hidden;
}

.mood-library-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 14px;
  background: #fff;
  border-bottom: 1px solid #E5E5EA;
  cursor: pointer;
  user-select: none;
}

.mood-library-head-left {
  flex: 1;
  min-width: 0;
}

.mood-library-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.mood-library-item-title {
  font-size: 15px;
  font-weight: 700;
  color: #1D1D1F;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mood-count-badge {
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  color: #666;
  background: #F5F5F7;
  border: 1px solid #E5E5EA;
  border-radius: 999px;
  padding: 2px 8px;
}

.mood-preview-strip {
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 26px;
  overflow: hidden;
}

.mood-preview-thumb {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  object-fit: cover;
  background: #F5F5F7;
  border: 1px solid #E5E5EA;
  flex-shrink: 0;
}

.mood-preview-more {
  font-size: 12px;
  color: #86868B;
  font-weight: 600;
}

.mood-library-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.mood-toggle {
  font-size: 18px;
  color: #86868B;
  transition: transform 0.2s;
}

.mood-library-config-item.open .mood-toggle {
  transform: rotate(180deg);
}

.mood-library-body {
  display: none;
  padding: 14px;
  background: #F5F5F7;
}

.mood-library-config-item.open .mood-library-body {
  display: block;
}

.mood-emotion-row {
  margin-bottom: 14px;
}

.mood-image-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.mood-image-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid #E5E5EA;
  border-radius: 12px;
  padding: 10px;
}

.mood-image-preview {
  width: 54px;
  height: 54px;
  border-radius: 10px;
  background: #F5F5F7;
  border: 1px solid #E5E5EA;
  object-fit: cover;
  flex-shrink: 0;
}

.mood-image-preview.broken {
  object-fit: contain;
  padding: 10px;
  opacity: 0.5;
}

.mood-image-input-wrap {
  flex: 1;
  min-width: 0;
}

.mood-image-input {
  width: 100%;
  padding: 10px 11px;
  border: 2px solid #E5E5EA;
  border-radius: 10px;
  font-size: 13px;
  outline: none;
  background: #FAFAFA;
  font-family: 'SF Mono', 'Menlo', monospace;
}

.mood-image-input:focus {
  border-color: #1D1D1F;
  background: #fff;
}

.mood-mini-btn {
  border: none;
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}

.mood-add-img-btn {
  width: 100%;
  margin-top: 12px;
  padding: 11px;
  border: 2px dashed #D1D1D6;
  border-radius: 12px;
  background: #fff;
  color: #1D1D1F;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.mood-empty-hint {
  font-size: 13px;
  color: #86868B;
  background: #fff;
  border: 1px dashed #D1D1D6;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
}
/* —— 最近封面库：多图分类版 —— */
.media-cover-config-item {
  padding: 0;
  overflow: hidden;
}

.media-cover-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px;
  background: #fff;
  border-bottom: 1px solid #E5E5EA;
  cursor: pointer;
  user-select: none;
}

.media-cover-head-left {
  flex: 1;
  min-width: 0;
}

.media-cover-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.media-cover-item-title {
  font-size: 15px;
  font-weight: 700;
  color: #1D1D1F;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.media-cover-count-badge {
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  color: #666;
  background: #F5F5F7;
  border: 1px solid #E5E5EA;
  border-radius: 999px;
  padding: 2px 8px;
}

.media-cover-preview-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 42px;
  overflow: hidden;
}

.media-cover-preview-thumb {
  width: 32px;
  height: 42px;
  border-radius: 7px;
  object-fit: cover;
  background: #F5F5F7;
  border: 1px solid #E5E5EA;
  flex-shrink: 0;
}

.media-cover-preview-more {

<script>
let currentMode = 'regex';
let regexData = null;
let regexOriginalHtml = '';
let regexParsedConfig = {};
let regexGeneratedJson = '';
let configVarName = '';
let configType = '';

let originalCode = '';
let parsedConfig = {};
let generatedCode = '';

let activeEditSectionKey = '';
let activeEditFieldKey = '';
let fontInjectEnabled = true;
let fontInjectPreset = 'inter-noto';


function switchMode(mode) {
  currentMode = mode;
  if (mode === 'regex') {
    document.getElementById('regexMode').style.display = 'block';
    document.getElementById('htmlMode').style.display = 'none';
    document.getElementById('regexModeBtn').classList.add('active');
    document.getElementById('htmlModeBtn').classList.remove('active');
  } else {
    document.getElementById('regexMode').style.display = 'none';
    document.getElementById('htmlMode').style.display = 'block';
    document.getElementById('regexModeBtn').classList.remove('active');
    document.getElementById('htmlModeBtn').classList.add('active');
  }
}

const regexUploadArea = document.getElementById('regexUploadArea');
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  regexUploadArea.addEventListener(eventName, preventDefaults, false);
});

function preventDefaults(e) {
  e.preventDefault();
  e.stopPropagation();
}

['dragenter', 'dragover'].forEach(eventName => {
  regexUploadArea.addEventListener(eventName, () => {
    regexUploadArea.classList.add('dragover');
  }, false);
});

['dragleave', 'drop'].forEach(eventName => {
  regexUploadArea.addEventListener(eventName, () => {
    regexUploadArea.classList.remove('dragover');
  }, false);
});

regexUploadArea.addEventListener('drop', (e) => {
  const files = e.dataTransfer.files;
  if (files.length > 0) {
    handleRegexFileContent(files[0]);
  }
}, false);

function handleRegexFile(event) {
  const file = event.target.files[0];
  if (file) {
    handleRegexFileContent(file);
  }
}

function handleRegexFileContent(file) {
  if (!file.name.endsWith('.json')) {
    alert('请选择 .json 文件');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      regexData = JSON.parse(e.target.result);
      if (!regexData.findRegex || regexData.replaceString === undefined) {
        alert('这不是有效的酒馆正则格式');
        return;
      }
      regexOriginalHtml = regexData.replaceString;
      parseRegexData();
      displayRegexInfo();
      if (regexParsedConfig && Object.keys(regexParsedConfig).length > 0) {
        generateRegexForm();
      } else {
        alert('replaceString 里没有找到 window.CONFIG，无法解析配置');
        return;
      }
document.getElementById('regexEditCard').classList.add('active');
      document.getElementById('regexEditCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      saveDraft();   // ✅ 导入成功就存草稿
    } catch (err) {
      alert('JSON 解析失败: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// 解析前清理常见的"手滑坑"：中文引号、全角符号等
function sanitizeConfigCode(code) {
  return code
    .replace(/[\u201c\u201d]/g, '"')   // 中文双引号 “ ” → "
    .replace(/[\u2018\u2019]/g, "'")   // 中文单引号 ‘ ’ → '
    .replace(/\uff1a/g, ':')           // 全角冒号 ： → :
    .replace(/\uff0c/g, ',')           // 全角逗号 ， → ,
    .replace(/\u3000/g, ' ');          // 全角空格 → 普通空格
}

function parseRegexData() {
  const replaceStr = regexData.replaceString;
  const configMatch = replaceStr.match(/window\.(\w*CONFIG)\s*=\s*(\{[\s\S]*?\n\}\s*;)/);
  if (configMatch) {
    try {
      let configCode = configMatch[2].replace(/\}\s*;$/, '}');
      configCode = sanitizeConfigCode(configCode);   // ✅ 先清理常见坑
      regexParsedConfig = eval('(' + configCode + ')');
      configVarName = configMatch[1];
            if (regexParsedConfig.playerType === 'tt-player') {
  configType = 'player';
} else if (regexParsedConfig.pinned && regexParsedConfig.messages && regexParsedConfig.chat) {
  configType = 'imessage';
} else if (regexParsedConfig.episodes && Array.isArray(regexParsedConfig.episodes)) {
  configType = 'podcast';
} else if (regexParsedConfig.stories || regexParsedConfig.post) {
  configType = 'instagram';
} else {
  configType = 'instagram';
}
regexParsedConfig = ensureInstagramConfigCompat(regexParsedConfig, replaceStr);
    } catch (e) {
      regexParsedConfig = {};
      console.error('配置解析失败:', e);
      // ✅ 明确告诉你大概啥问题
      alert('配置解析失败：' + e.message +
        '\n\n常见原因：配置里有中文标点、引号没成对、或多了/少了逗号。\n可以按 F12 看控制台定位具体位置。');
    }
  } else {
    regexParsedConfig = {};
  }
}


function displayRegexInfo() {
  const infoDiv = document.getElementById('regexInfoDisplay');
  let html = '<div class="regex-info-title">📋 正则信息</div>';
  html += `<div><strong>名称:</strong> ${regexData.scriptName || '未命名'}</div>`;
  html += '<div style="margin-top: 8px;">';
  html += `<span class="info-badge">${regexData.disabled ? '❌ 已禁用' : '✅ 已启用'}</span>`;
  html += `<span class="info-badge">${regexData.markdownOnly ? '📝 仅Markdown' : '🌐 全部'}</span>`;
  html += `<span class="info-badge">${regexData.runOnEdit ? '⚡ 编辑时运行' : '💬 发送时运行'}</span>`;
  if (regexData.minDepth !== null && regexData.minDepth !== undefined) {
    html += `<span class="info-badge">最小深度: ${regexData.minDepth}</span>`;
  }
  if (regexData.maxDepth !== null && regexData.maxDepth !== undefined) {
    html += `<span class="info-badge">最大深度: ${regexData.maxDepth}</span>`;
  }
  html += '</div>';
  infoDiv.innerHTML = html;
}

function switchRegexTab(tab) {
  const tabs = document.querySelectorAll('#regexEditCard .tab-btn');
  const contents = document.querySelectorAll('#regexEditCard .tab-content');
  tabs.forEach(t => t.classList.remove('active'));
  contents.forEach(c => c.classList.remove('active'));
  if (tab === 'edit') {
    tabs[0].classList.add('active');
    document.getElementById('regexEditTab').classList.add('active');
  } else {
    tabs[1].classList.add('active');
    document.getElementById('regexPreviewTab').classList.add('active');
    updateRegexPreview();
  }
}

function normalizeColor(v) {
  v = String(v == null ? '' : v).trim();
  if (!v) return '';
  // 没带 # 且是 3 位或 6 位十六进制，就补上 #
  if (v[0] !== '#' && /^([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)) {
    v = '#' + v;
  }
  return v;
}

function isColorKey(key) {
  // bubble 的 4 个都以 Color 结尾，theme 这两个单独列
  return /Color$/.test(key) || key === 'theme.headBg' || key === 'theme.accent';
}


function collectConfig(baseConfig, scope) {
  const newConfig = JSON.parse(JSON.stringify(baseConfig));


if (newConfig.pinned) newConfig.pinned = [];
if (newConfig.messages) newConfig.messages = [];
if (newConfig.notes && newConfig.notes.translateLabels) newConfig.notes.translateLabels = [];

if (newConfig.notes && newConfig.notes.mediaCovers) newConfig.notes.mediaCovers = {};
if (newConfig.moodLibrary) newConfig.moodLibrary = {};


  if (newConfig.stories) newConfig.stories = [];
  if (newConfig.post && newConfig.post.images) newConfig.post.images = [];

  if (newConfig.episodes) newConfig.episodes = [];
  if (newConfig.reviews) newConfig.reviews = [];


  scope.querySelectorAll('[data-key]').forEach(input => {
    const key = input.dataset.key;
    const value = input.value.trim();

//——— iMessage 置顶联系人 ———
if (key.startsWith('pinned[')) {
  const match = key.match(/pinned\[(\d+)\]\.(avatar|name|shape)/);
  if (match) {
    const idx = parseInt(match[1]);
    const field = match[2];
    if (!newConfig.pinned) newConfig.pinned = [];
    if (!newConfig.pinned[idx]) newConfig.pinned[idx] = { avatar: '', name: '', shape: 'circle' };
    newConfig.pinned[idx][field] = value;
  }
  return;
}

// ——— iMessage 信息列表 ———
if (key.startsWith('messages[')) {
  const match = key.match(/^messages\[(\d+)\]\.(avatar|name|preview|time|unreadDotColor|unread|shape|action)$/);
  if (match) {
    const idx = parseInt(match[1]);
    const field = match[2];
    if (!newConfig.messages) newConfig.messages = [];
    if (!newConfig.messages[idx]) {
      newConfig.messages[idx] = { avatar:'', name:'', preview:'', time:'', unread:false, unreadDotColor:'', shape:'circle', action:'' };
    }
    if (field === 'unread') {
      newConfig.messages[idx][field] = (value === 'true');
    } else {
      newConfig.messages[idx][field] = value;
    }
  }
  return;
}

// ——— 备忘录翻译标签 ———
if (key.startsWith('notes.translateLabels[')) {
  const match = key.match(/notes\.translateLabels\[(\d+)\]\.(from|to)/);
  if (match) {
    const idx = parseInt(match[1]);
    const field = match[2];
    if (!newConfig.notes) newConfig.notes = {};
    if (!newConfig.notes.translateLabels) newConfig.notes.translateLabels = [];
    if (!newConfig.notes.translateLabels[idx]) newConfig.notes.translateLabels[idx] = { from: '', to: '' };
    newConfig.notes.translateLabels[idx][field] = value;
  }
  return;
}


// ——— 备忘录：最近模块类型封面库，新版：一个类型多张图 ———
if (key.startsWith('notes.mediaCovers[')) {
  const matchType = key.match(/^notes\.mediaCovers\[(\d+)\]\.type$/);
  const matchImage = key.match(/^notes\.mediaCovers\[(\d+)\]\.images\[(\d+)\]$/);

  if (matchType) {
    const idx = parseInt(matchType[1]);

    if (!newConfig.notes) newConfig.notes = {};
    if (!newConfig.notes.mediaCovers) newConfig.notes.mediaCovers = {};
    if (!newConfig.__mediaCoverTemp) newConfig.__mediaCoverTemp = [];

    if (!newConfig.__mediaCoverTemp[idx]) {
      newConfig.__mediaCoverTemp[idx] = { type: '', images: [] };
    }

    newConfig.__mediaCoverTemp[idx].type = value;
    return;
  }

  if (matchImage) {
    const idx = parseInt(matchImage[1]);
    const imgIdx = parseInt(matchImage[2]);

    if (!newConfig.notes) newConfig.notes = {};
    if (!newConfig.notes.mediaCovers) newConfig.notes.mediaCovers = {};
    if (!newConfig.__mediaCoverTemp) newConfig.__mediaCoverTemp = [];

    if (!newConfig.__mediaCoverTemp[idx]) {
      newConfig.__mediaCoverTemp[idx] = { type: '', images: [] };
    }

    newConfig.__mediaCoverTemp[idx].images[imgIdx] = value;
    return;
  }

  return;
}


// ——— 心情表情包库：新版，支持每张图片单独一行 ———
if (key.startsWith('moodLibrary[')) {
  const matchEmotion = key.match(/^moodLibrary\[(\d+)\]\.emotion$/);
  const matchImage = key.match(/^moodLibrary\[(\d+)\]\.images\[(\d+)\]$/);

  if (matchEmotion) {
    const idx = parseInt(matchEmotion[1]);

    if (!newConfig.moodLibrary) newConfig.moodLibrary = {};
    if (!newConfig.__moodLibraryTemp) newConfig.__moodLibraryTemp = [];
    if (!newConfig.__moodLibraryTemp[idx]) {
      newConfig.__moodLibraryTemp[idx] = { emotion: '', images: [] };
    }

    newConfig.__moodLibraryTemp[idx].emotion = value;
    return;
  }

  if (matchImage) {
    const idx = parseInt(matchImage[1]);
    const imgIdx = parseInt(matchImage[2]);

    if (!newConfig.moodLibrary) newConfig.moodLibrary = {};
    if (!newConfig.__moodLibraryTemp) newConfig.__moodLibraryTemp = [];
    if (!newConfig.__moodLibraryTemp[idx]) {
      newConfig.__moodLibraryTemp[idx] = { emotion: '', images: [] };
    }

    newConfig.__moodLibraryTemp[idx].images[imgIdx] = value;
    return;
  }

  return;
}

if (
  key === 'panelToggle.enabled' ||
  key === 'panelToggle.defaultCollapsed' ||
  key === 'panelToggle.hideOnOverlay'
) {
  if (!newConfig.panelToggle) newConfig.panelToggle = {};

  const field = key.split('.')[1];
  newConfig.panelToggle[field] = (value === 'true');

  return;
}

// ——— 布尔值字段 ———
if (key === 'darkMode') {
  newConfig.darkMode = (value === 'true');
  return;
}
if (key === 'notes.tweetUser.verified' || key === 'notes.tweetUser.followBtn') {
  const keys2 = key.split('.');
  let target2 = newConfig;
  for (let i = 0; i < keys2.length - 1; i++) {
    if (!target2[keys2[i]]) target2[keys2[i]] = {};
    target2 = target2[keys2[i]];
  }
  target2[keys2[keys2.length - 1]] = (value === 'true');
  return;
}


    if (key.startsWith('stories[')) {
      const match = key.match(/stories\[(\d+)\]\.(img|name)/);
      if (match) {
        const idx = parseInt(match[1]);
        const field = match[2];
        if (!newConfig.stories[idx]) {
          newConfig.stories[idx] = { img: '', name: '' };
        }
        newConfig.stories[idx][field] = value;
      }
      return;
    }

    if (key.startsWith('post.images[')) {
      const match = key.match(/post\.images\[(\d+)\]/);
      if (match) {
        const idx = parseInt(match[1]);
        if (value) {
          newConfig.post.images[idx] = value;
        }
      }
      return;
    }

    if (key.startsWith('episodes[')) {
      const match = key.match(/episodes\[(\d+)\]\.(num|title|desc|thumb|duration)/);
      if (match) {
        const idx = parseInt(match[1]);
        const field = match[2];
        if (!newConfig.episodes[idx]) {

          newConfig.reviews[idx] = { title: '', time: '', stars: 0, user: '', body: '' };

        newConfig.reviews[idx][field] = field === 'stars' ? (Number(value) || 0) : value;

    const keys = key.split(/[\.\[\]]/).filter(k => k);
    let target = newConfig;
    for (let i = 0; i < keys.length - 1; i++) {
      const k = keys[i];
      if (!target[k]) target[k] = isNaN(keys[i + 1]) ? {} : [];
      target = target[k];
    }

const lastKey = keys[keys.length - 1];
if (isColorKey(key)) {
  target[lastKey] = normalizeColor(value);   // 颜色优先处理，自动补 #
} else if (!isNaN(value) && value !== '') {
  target[lastKey] = Number(value);
} else {
  target[lastKey] = value;
}
  });   // ✅ 补回这一行，关掉 forEach 循环

// 整理心情表情包库：新版

function stripTutuFontInjection(html) {
  if (!html) return html;

  return html.replace(
    /\n?<!--\s*TUTU_FONT_INJECT_START\s*-->[\s\S]*?<!--\s*TUTU_FONT_INJECT_END\s*-->\n?/g,
    '\n'
  );
}

function injectFontPreset(html) {
  if (!html) return html;

  // 先移除旧注入，避免重复叠加
  html = stripTutuFontInjection(html);

  if (!fontInjectEnabled) return html;

  const preset = FONT_PRESETS[fontInjectPreset] || FONT_PRESETS['inter-noto'];

  const css = `
<style id="tutu-font-inject-style">
:root {
  --tutu-injected-font: ${preset.stack};
  --tutu-symbol-font:
    "Segoe UI Symbol",
    "Apple Color Emoji",
    "Noto Color Emoji",
    -apple-system,
    sans-serif;
}

/* 兔兔工具箱字体注入：全局字体 */
html,
body {
  font-family: var(--tutu-injected-font) !important;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 大部分普通文字继承全局字体 */
body * {
  font-family: inherit !important;
}

/* 避免影响图片、svg、canvas、视频 */
svg,
svg *,
img,
canvas,
video {
  font-family: initial !important;
}

/* 表单控件也使用注入字体 */
textarea,
input,
button,
select {
  font-family: var(--tutu-injected-font) !important;
}

/* 代码块/编辑框保留等宽字体 */
code,
pre,
textarea.code,
textarea.form-textarea {
  font-family:
    "SF Mono",
    "Menlo",
    "Consolas",
    "Liberation Mono",
    monospace !important;
}

/* 星星、评分、emoji、小符号用符号字体兜底 */
.symbol-font,
.star-font,
.rating-stars,
.emoji-font,
[class*="star"],
[class*="rating"] {
  font-family:
    var(--tutu-symbol-font) !important;
}
</style>`.trim();

  const injection =
    '\n<!-- TUTU_FONT_INJECT_START -->\n' +
    (preset.links ? preset.links + '\n' : '') +
    css +
    '\n<!-- TUTU_FONT_INJECT_END -->\n';

  if (html.includes('</head>')) {
    return html.replace('</head>', injection + '</head>');
  }

  // 万一没有 head，就直接塞最前面
  return injection + html;
}

function getPreviousNotesHeading(el, root) {
  if (!el || !root) return el;

  // 先爬到 modulesContainer 的直接子元素
  let node = el;
  while (node && node.parentElement !== root) {
    node = node.parentElement;
  }

  // 从当前模块往前找最近的标题
  while (node) {
    if (node.classList && node.classList.contains('note-heading')) {
      return node;
    }
    node = node.previousElementSibling;
  }

  return el;
}


function findImsgNotesPreviewTarget(doc, sectionKey) {
  if (!doc) return null;

  const win = doc.defaultView;
  const cfg = win && win.CONFIG ? win.CONFIG : {};
  const notes = cfg.notes || {};

  const editor = doc.querySelector('#page-notes #noteEditor');
  const root = doc.querySelector('#page-notes #modulesContainer');

  if (!editor) return null;

  if (sectionKey === 'notesBasic') {
    return doc.querySelector('#page-notes .note-date-line') || editor;
  }

  if (sectionKey === 'notesTitles') {
    const titleKeyMap = {
      'notes.diaryTitle': notes.diaryTitle || '往年日记',
      'notes.todoTitle': notes.todoTitle || '待办事项',
      'notes.moodTitle': notes.moodTitle || '此刻心情',
      'notes.translateTitle': notes.translateTitle || '翻译',
      'notes.mediaTitle': notes.mediaTitle || '最近',
      'notes.tweetTitle': notes.tweetTitle || '今日说法'
    };

    const wantedTitle = titleKeyMap[activeEditFieldKey];

    if (wantedTitle) {
      const headings = Array.from(doc.querySelectorAll('#page-notes .note-heading'));
      const hit = headings.find(el => el.textContent.trim() === String(wantedTitle).trim());
      if (hit) return hit;
    }

    return doc.querySelector('#page-notes .note-date-line') || editor;
  }

  const moduleName = getNotesModuleNameBySection(sectionKey);

  if (!moduleName) {
    return doc.querySelector('#page-notes .note-date-line') || editor;
  }

  let target = doc.querySelector(`#page-notes [data-tutu-notes-module="${moduleName}"]`);
  if (target) return target;

  if (moduleName === 'mood') {
    const el = doc.querySelector('#page-notes .mood-block');
    return getPreviousNotesHeading(el, root);
  }

  if (moduleName === 'translate') {
    const el = doc.querySelector('#page-notes .translate-embed');
    return getPreviousNotesHeading(el, root);
  }

  if (moduleName === 'media') {
    const el = doc.querySelector('#page-notes .media-card') ||
               doc.querySelector('#page-notes .media-heading');
    return getPreviousNotesHeading(el, root);
  }

  if (moduleName === 'tweet') {
    const el = doc.querySelector('#page-notes .tweet-card');
    return getPreviousNotesHeading(el, root);
  }

  return doc.querySelector('#page-notes .note-date-line') || editor;
}

function scrollImsgNotesEditorToSection(doc, sectionKey) {
  if (!doc || !isImsgNotesSection(sectionKey)) return;

  const win = doc.defaultView;
  const editor = doc.querySelector('#page-notes #noteEditor');
  if (!editor) return;

  try {
    if (win && typeof win.tutuNotesUpdateAll === 'function') {
      win.tutuNotesUpdateAll();
    }
  } catch (e) {}

  function doScroll() {
    const target = findImsgNotesPreviewTarget(doc, sectionKey);
    if (!target || !editor) return;

    const editorRect = editor.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();

    const nextTop = editor.scrollTop + targetRect.top - editorRect.top - 18;

    editor.scrollTo({
      top: Math.max(0, nextTop),
      behavior: 'smooth'
    });
  }

  setTimeout(doScroll, 120);
  setTimeout(doScroll, 420);
  setTimeout(doScroll, 900);
}
function renderPreviewIframe(containerId, html, height) {
  const container = document.getElementById(containerId);
  if (!container) return;

  container.innerHTML = '';

  const frame = document.createElement('iframe');
  frame.style.width = '100%';
  frame.style.height = height + 'px';
  frame.style.border = '0';
  frame.style.borderRadius = '10px';
  frame.style.background = '#fff';
  frame.srcdoc = html;

  frame.onload = function() {
    setTimeout(function() {
      try {
        shrinkPreviewFrame(frame, height);
        autoScrollPreviewFrame(frame);
      } catch (e) {
        console.warn('预览自动跳转失败:', e);
      }
    }, 350);

    // IG 模板有 setTimeout 初始化，后面再收缩几次
    setTimeout(function() {
      try {
        shrinkPreviewFrame(frame, height);
      } catch (e) {}
    }, 800);

    setTimeout(function() {
      try {
        shrinkPreviewFrame(frame, height);
      } catch (e) {}
    }, 1400);
  };

  container.appendChild(frame);
}

function shrinkPreviewFrame(frame, maxHeight) {
  if (!frame || !frame.contentDocument) return;

  const doc = frame.contentDocument;
  const body = doc.body;
  const html = doc.documentElement;
  if (!body || !html) return;

  let contentHeight = Math.max(
    body.scrollHeight || 0,
    html.scrollHeight || 0,
    body.offsetHeight || 0,
    html.offsetHeight || 0
  );

  // IG 模板经常因为 transform/居中导致 scrollHeight 偏大，这里按可见主体再算一次
  if (configType === 'instagram') {
    const panel = doc.querySelector('.ig-panel.open') || doc.querySelector('.ig-panel');
    const banner = doc.querySelector('.ios-banner');

    if (panel) {
      const panelRect = panel.getBoundingClientRect();
      const bannerRect = banner ? banner.getBoundingClientRect() : null;

      let bottom = panelRect.bottom;
      let top = panelRect.top;

      if (bannerRect) {
        top = Math.min(top, bannerRect.top);
        bottom = Math.max(bottom, bannerRect.bottom);
      }

      contentHeight = Math.ceil(bottom - Math.min(0, top) + 24);
    }
  }

  const minHeight = configType === 'instagram' ? 420 : 320;
  const finalHeight = Math.max(minHeight, Math.min(maxHeight, contentHeight));

  frame.style.height = finalHeight + 'px';
}

function autoScrollPreviewFrame(frame) {
  if (!frame || !frame.contentWindow || !frame.contentDocument) return;

  const doc = frame.contentDocument;
  const win = frame.contentWindow;

  let target = null;

  if (configType === 'imessage') {
    const anchorId = getImsgPreviewAnchorId(activeEditSectionKey);
    target = doc.getElementById(anchorId);
  }

  if (configType === 'instagram') {
    target = getInstagramPreviewTarget(doc, activeEditSectionKey);
  }

  if (configType === 'player') {
    target = doc.querySelector('.player') || doc.body;
  }

  if (!target) return;

const rect = target.getBoundingClientRect();
const currentY = win.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop || 0;

// 不同模板给不同的上方留白
let offset = 12;

if (configType === 'instagram') {
  // IG 预览不要贴得太低，也不要滚太过
  offset = 24;

  // DM 页从头部看更自然
  if (activeEditSectionKey === 'dmInfo') {
    offset = 12;
  }

  // 气泡颜色编辑时，聊天区稍微往上留一点
  if (activeEditSectionKey === 'bubble') {
    offset = 40;
  }
}

let nextTop = currentY + rect.top - offset;

const scrollEl = doc.scrollingElement || doc.documentElement || doc.body;
const maxTop = Math.max(0, scrollEl.scrollHeight - win.innerHeight);

// 关键：限制最大滚动，避免滚到下面一大片空白
nextTop = Math.max(0, Math.min(nextTop, maxTop));

win.scrollTo({
  top: nextTop,
  behavior: 'smooth'
});

// iMessage 的 Notes 是内部滚动容器，外层 iframe 滚完后，还要滚 #noteEditor
if (configType === 'imessage' && isImsgNotesSection(activeEditSectionKey)) {
  scrollImsgNotesEditorToSection(doc, activeEditSectionKey);
}
}

function generateRegexJson() {
  const newConfig = collectConfig(regexParsedConfig, document.getElementById('regexFormFields'));
  const configStr = buildConfigStr(newConfig);

let nextRegexHtml = regexOriginalHtml.replace(
  new RegExp('window\\.' + configVarName + '\\s*=\\s*\\{[\\s\\S]*?\\n\\}\\s*;'),
  configStr
);

nextRegexHtml = patchInstagramTemplate(nextRegexHtml);
nextRegexHtml = injectFontPreset(nextRegexHtml);

regexData.replaceString = nextRegexHtml;

  regexGeneratedJson = JSON.stringify(regexData, null, 2);
  document.getElementById('regexOutputCard').classList.add('active');
  document.getElementById('regexOutputCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  const msg = document.getElementById('regexSuccessMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

function downloadRegexJson() {
  const blob = new Blob([regexGeneratedJson], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const filename = (regexData.scriptName || 'regex').replace(/[^a-zA-Z0-9\u4e00-\u9fa5_\-\[\]【】]/g, '_') + '.json';
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function clampPlayerSliderValue(key, value) {
  const cfg = PLAYER_SLIDER_FIELDS[key];
  if (!cfg) return value;

  let n = Number(value);
  if (!Number.isFinite(n)) n = cfg.min;

  return Math.max(cfg.min, Math.min(cfg.max, n));
}

function parseCode() {
  const input = document.getElementById('inputCode').value.trim();
  if (!input) {
    alert('请先粘贴代码');
    return;
  }
  const configMatch = input.match(/window\.(\w*CONFIG)\s*=\s*(\{[\s\S]*?\n\}\s*;)/);
  if (!configMatch) {
    alert('未找到配置区（需要 window.CONFIG 格式）');
    return;
  }
  originalCode = input;
  configVarName = configMatch[1];
  try {
let configCode = configMatch[2].replace(/\}\s*;$/, '}');
    configCode = sanitizeConfigCode(configCode);   // ✅ 先清理
    parsedConfig = eval('(' + configCode + ')');
              if (parsedConfig.playerType === 'tt-player') {
  configType = 'player';
} else if (parsedConfig.pinned && parsedConfig.messages && parsedConfig.chat) {
  configType = 'imessage';
} else if (parsedConfig.episodes && Array.isArray(parsedConfig.episodes)) {
  configType = 'podcast';
} else if (parsedConfig.stories || parsedConfig.post) {
  configType = 'instagram';
} else {
  configType = 'instagram';
}

// 关键：HTML 模式也补旧版 IG 字段
parsedConfig = ensureInstagramConfigCompat(parsedConfig, input);

buildForm(document.getElementById('formFields'), parsedConfig);

    document.getElementById('formSection').classList.add('active');
    document.getElementById('formSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    alert('配置解析失败: ' + e.message);
    console.error(e);
  }
}

function createPinnedItem(p, idx) {
  const pair = document.createElement('div');
  pair.className = 'form-group-pair pinned-config-item';
  pair.dataset.pinnedIndex = idx;

  const header = document.createElement('div');
  header.className = 'contact-collapse-header';

  const titleWrap = document.createElement('div');
  titleWrap.className = 'contact-collapse-title-wrap';

  const title = document.createElement('div');
  title.className = 'contact-collapse-title pinned-item-title';
  title.textContent = `置顶联系人 ${idx + 1}` + (p.name ? ` — ${p.name}` : '');

  const subtitle = document.createElement('div');
  subtitle.className = 'contact-collapse-subtitle pinned-item-subtitle';
  subtitle.textContent = p.avatar ? '已填写头像链接' : '未填写头像';

  titleWrap.appendChild(title);
  titleWrap.appendChild(subtitle);

  const actions = document.createElement('div');
  actions.className = 'contact-collapse-actions';

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'delete-btn';
  delBtn.textContent = '删除';
  delBtn.onclick = function(e) {
    e.preventDefault();
    e.stopPropagation();
    deletePinnedItem(pair);
  };

  const toggle = document.createElement('span');
  toggle.className = 'contact-collapse-toggle';
  toggle.textContent = '⌄';

  actions.appendChild(delBtn);
  actions.appendChild(toggle);

  header.appendChild(titleWrap);
  header.appendChild(actions);

  header.addEventListener('click', function(e) {
    if (e.target.closest('button')) return;
    pair.classList.toggle('open');
  });

  const body = document.createElement('div');
  body.className = 'contact-collapse-body';

  body.appendChild(createFormGroup(`pinned[${idx}].avatar`, '头像链接', 'text', p.avatar || ''));
  body.appendChild(createFormGroup(`pinned[${idx}].name`, '名称', 'text', p.name || ''));
  body.appendChild(createFormGroup(`pinned[${idx}].shape`, '形状（circle / square）', 'text', p.shape || 'circle'));

  const nameInput = body.querySelector(`[data-key="pinned[${idx}].name"]`);
  const avatarInput = body.querySelector(`[data-key="pinned[${idx}].avatar"]`);

  if (nameInput) {
    nameInput.addEventListener('input', function() {
      const name = nameInput.value.trim();
      title.textContent = `置顶联系人 ${idx + 1}` + (name ? ` — ${name}` : '');
    });
  }

  if (avatarInput) {
    avatarInput.addEventListener('input', function() {
      subtitle.textContent = avatarInput.value.trim() ? '已填写头像链接' : '未填写头像';
    });
  }

  pair.appendChild(header);
  pair.appendChild(body);

  return pair;
}

function addPinnedItem() {
  const container = getPinnedContainer();

  if (!container) {
    if (typeof showToast === 'function') showToast('没有找到置顶联系人容器');
    return;
  }

  const count = container.querySelectorAll('.pinned-config-item').length;

  container.appendChild(createPinnedItem({
    avatar: '',
    name: '',
    shape: 'circle'
  }, count));

  reindexPinnedItems();

  if (typeof autoRefresh === 'function') {
    autoRefresh();
  } else if (typeof saveDraft === 'function') {
    saveDraft();
  }
}

function deletePinnedItem(itemOrIndex) {
  const container = getPinnedContainer();
  if (!container) return;

  const items = Array.from(container.querySelectorAll('.pinned-config-item'));

  let item = null;

  if (typeof itemOrIndex === 'number') {
    item = items[itemOrIndex];
  } else if (itemOrIndex && itemOrIndex.nodeType === 1) {
    item = itemOrIndex.closest('.pinned-config-item');
  }

  if (!item) return;

  item.remove();
  reindexPinnedItems();

  if (typeof autoRefresh === 'function') {
    autoRefresh();
  } else if (typeof saveDraft === 'function') {
    saveDraft();
  }
}

function reindexPinnedItems() {
  const container = getPinnedContainer();
  if (!container) return;

  const items = Array.from(container.querySelectorAll('.pinned-config-item'));

  items.forEach((item, newIdx) => {
    item.dataset.pinnedIndex = newIdx;

    const nameInput = item.querySelector('[data-key$=".name"]');
    const name = nameInput ? nameInput.value.trim() : '';

const previewInput = item.querySelector('[data-key$=".preview"]');
const timeInput = item.querySelector('[data-key$=".time"]');

const preview = previewInput ? previewInput.value.trim() : '';
const time = timeInput ? timeInput.value.trim() : '';


    const title = item.querySelector('.pinned-item-title') || item.querySelector('.form-group-header span');
    if (title) {
      title.textContent = `置顶联系人 ${newIdx + 1}` + (name ? ` — ${name}` : '');
    }



    const subtitle = item.querySelector('.pinned-item-subtitle');
if (subtitle) {
  subtitle.textContent = avatar ? '已填写头像链接' : '未填写头像';
}
const delBtn = item.querySelector('.delete-btn');
    if (delBtn) {
      delBtn.type = 'button';
      delBtn.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        deletePinnedItem(item);
      };
    }

    item.querySelectorAll('[data-key]').forEach(input => {
      const fieldMatch = input.dataset.key.match(/pinned\[\d+\]\.(\w+)$/);
      if (!fieldMatch) return;

// ——— 批量导入图片链接：支持逗号、中文逗号、换行、空格、txt/csv 文件 ———
function parseBulkImageLinks(text) {
  let raw = String(text || '').trim();
  if (!raw) return [];

  // 优先抓取 http/https 链接，避免文本里混入说明文字时误导入
  const urlMatches = raw.match(/https?:\/\/[^\s，,，]+/g);
  if (urlMatches && urlMatches.length) {
    return [...new Set(
      urlMatches
        .map(s => s.trim())
        .filter(Boolean)
    )];
  }

  // 如果不是标准链接，也允许按分隔符拆分
  let parts = raw
    .replace(/[，,]/g, '\n')
    .replace(/\t/g, '\n')
    .split(/\n+/)
    .flatMap(part => part.split(/\s+/))
    .map(s => s.trim())
    .filter(Boolean);

  return [...new Set(parts)];
}

function readBulkTxtFile(file, textarea) {
  if (!file) return;

  if (!/\.(txt|text|csv)$/i.test(file.name)) {
    if (typeof showToast === 'function') {
      showToast('❌ 请拖入 txt / csv 文件');
    } else {
      alert('请拖入 txt / csv 文件');
    }
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    const oldVal = textarea.value.trim();
    const newVal = String(e.target.result || '').trim();

    textarea.value = oldVal
      ? oldVal + '\n' + newVal
      : newVal;

    if (typeof showToast === 'function') {
      showToast('✅ 文件内容已读取');
    }
  };

  reader.readAsText(file);
}

https://xxx.com/1.jpg, https://xxx.com/2.jpg
https://xxx.com/3.jpg
https://xxx.com/4.jpg"></textarea>

  importBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    const links = parseBulkImageLinks(textarea.value);

    if (!links.length) {
      if (typeof showToast === 'function') {
        showToast('还没有识别到链接哦～');
      } else {
        alert('还没有识别到链接哦～');
      }
      return;
    }

    let count = links.length;

    if (typeof options.onImport === 'function') {
      count = options.onImport(links);
      if (count === undefined || count === null) {
        count = links.length;
      }
    }

    textarea.value = '';

    if (typeof showToast === 'function') {
      showToast(`✅ 已新增 ${count} 个链接`);
    } else {
      alert(`已新增 ${count} 个链接`);
    }

    if (typeof autoRefresh === 'function') autoRefresh();
    if (typeof saveDraft === 'function') saveDraft();
  });

    e.stopPropagation();
    textarea.value = '';
  });

  fileBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    readBulkTxtFile(file, textarea);
    fileInput.value = '';
  });

  // 支持直接拖 txt/csv 到输入框
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
    textarea.addEventListener(ev, function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
  });

  ['dragenter', 'dragover'].forEach(ev => {
    textarea.addEventListener(ev, function() {
      textarea.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(ev => {
    textarea.addEventListener(ev, function() {
      textarea.classList.remove('dragover');
    });
  });

  textarea.addEventListener('drop', function(e) {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) {
      readBulkTxtFile(file, textarea);
    }
  });

  return panel;
}

function makeImageArraySignature(images) {
  let arr = [];

  if (Array.isArray(images)) {
    arr = images
      .map(s => String(s || '').trim())
      .filter(Boolean);
  } else if (typeof images === 'string' && images.trim()) {
    arr = [images.trim()];
  }

  // 排序后做签名：同一批图片即使顺序不同，也会被认为是同一个库
  return [...new Set(arr)].sort().join('\n');
}

function groupSameImageLibrary(obj) {
  obj = obj || {};

  const map = {};

  Object.keys(obj).forEach(name => {
    const images = obj[name];
    const sig = makeImageArraySignature(images);
    if (!sig) return;

    if (!map[sig]) {
      map[sig] = {
        names: [],
        images: Array.isArray(images)
          ? images.map(s => String(s || '').trim()).filter(Boolean)
          : [String(images || '').trim()].filter(Boolean)
      };
    }

    map[sig].names.push(name);
  });

  return Object.keys(map).map(sig => ({
    name: map[sig].names.join(', '),
    images: [...new Set(map[sig].images)]
  }));
}

function normalizeMediaCoverImages(images) {
  // 新版：数组
  if (Array.isArray(images)) {
    return images
      .map(s => String(s || '').trim())
      .filter(Boolean);
  }

  // 旧版：单字符串
  if (typeof images === 'string' && images.trim()) {
    return [images.trim()];
  }

  return [];
}

function inferType(value) {

}

function createFormGroup(key, label, type, value) {
  const fg = document.createElement('div');
  fg.className = 'form-group';

  const lbl = document.createElement('label');
  lbl.className = 'form-label';
  lbl.textContent = label;
  fg.appendChild(lbl);

  const options = getFieldOptions(key);

  // 如果这个字段有预设选项，就渲染成按钮组
  if (options) {
    const hiddenInput = document.createElement('input');
    hiddenInput.type = 'hidden';
    hiddenInput.dataset.key = key;
    hiddenInput.value = value !== undefined && value !== null ? String(value) : '';

    const group = document.createElement('div');
    group.className = 'choice-group';

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.textContent = opt.label;
      btn.dataset.value = opt.value;

      if (String(hiddenInput.value) === String(opt.value)) {
        btn.classList.add('active');
      }

      btn.addEventListener('click', function() {
        hiddenInput.value = opt.value;

        group.querySelectorAll('.choice-btn').forEach(b => {
          b.classList.toggle('active', b === btn);
        });

        // 触发自动保存/自动预览
        hiddenInput.dispatchEvent(new Event('input', { bubbles: true }));
      });

      group.appendChild(btn);
    });

    fg.appendChild(group);
    fg.appendChild(hiddenInput);

    return fg;
  }
// 播放器数值字段：滑条
  if (PLAYER_SLIDER_FIELDS[key]) {
    const cfg = PLAYER_SLIDER_FIELDS[key];
    const sliderValue = clampPlayerSliderValue(key, value);

    const wrap = document.createElement('div');
    wrap.className = 'player-slider-wrap';

    const input = document.createElement('input');
    input.className = 'player-range';
    input.type = 'range';
    input.min = cfg.min;
    input.max = cfg.max;
    input.step = cfg.step;
    input.value = sliderValue;
    input.dataset.key = key;

    const val = document.createElement('span');
    val.className = 'player-range-value';
    val.textContent = cfg.format(Number(input.value));

    input.addEventListener('input', function() {
      val.textContent = cfg.format(Number(input.value));
    });

    wrap.appendChild(input);
    wrap.appendChild(val);
    fg.appendChild(wrap);

    return fg;
  }
  // 普通输入框 / 文本框
  const input = document.createElement(type === 'textarea' ? 'textarea' : 'input');
  input.className = type === 'textarea' ? 'form-textarea' : 'form-input';
  input.dataset.key = key;

  if (type !== 'textarea') input.type = 'text';

  input.value = value !== undefined && value !== null ? String(value) : '';

  fg.appendChild(input);

    // 检测占位符
  const valStr = String(value || '');
  const placeholders = valStr.match(/\$\d/g);

  if (placeholders) {
    const hint = document.createElement('div');
    hint.className = 'placeholder-hint';
    const unique = [...new Set(placeholders)].join(' / ');
    hint.textContent = `⚠️ 含占位符 ${unique}，会随剧情自动变化，非必要请勿改动哦～`;
    fg.appendChild(hint);
  }

  // iMessage 前两条预览由剧情自动抓取，不需要手填
  if (
    key === 'messages[0].preview' ||
    key === 'messages[1].preview'
  ) {
    const hint = document.createElement('div');
    hint.className = 'placeholder-hint';
    hint.textContent = '⚠️ 这个预览文本会随剧情自动生成，建议留空，不要手动填写～';
    fg.appendChild(hint);
  }

  return fg;
}

}

    && document.getElementById('htmlPreviewTab').classList.contains('active');
  if (htmlPreviewOpen && originalCode) updateHtmlPreview();

  saveDraft(); // 顺便存草稿（见 3-4）
}, 500);

document.addEventListener('input', function(e) {
  if (e.target.dataset && e.target.dataset.key !== undefined) {
    activeEditFieldKey = e.target.dataset.key || '';

    const block = e.target.closest('.section-block');
    if (block && block.dataset.sectionKey) {
      activeEditSectionKey = block.dataset.sectionKey;
    }

    autoRefresh();
  }
});

document.addEventListener('focusin', function(e) {
  if (e.target.dataset && e.target.dataset.key !== undefined) {
    activeEditFieldKey = e.target.dataset.key || '';

    const block = e.target.closest('.section-block');
    if (block && block.dataset.sectionKey) {
      activeEditSectionKey = block.dataset.sectionKey;
    }
  }
});


function copyCode() {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(generatedCode)
      .then(() => showToast('✅ 复制成功'))
      .catch(() => fallbackCopy());
  } else {
    fallbackCopy();
  }
}

function fallbackCopy() {
  const temp = document.createElement('textarea');
  temp.value = generatedCode;
  temp.style.position = 'fixed';
  temp.style.opacity = '0';
  document.body.appendChild(temp);
  temp.select();
  try {
    document.execCommand('copy');
    showToast('✅ 复制成功');
  } catch (err) {
    showToast('❌ 复制失败，请手动复制');
  }
  document.body.removeChild(temp);
}

function updateDraftAfterClear(part) {
  try {
    const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}');

    if (part === 'html') {
      delete draft.htmlInput;
    }

    if (part === 'regex') {
      delete draft.regexData;
    }

    if (!draft.htmlInput && !draft.regexData) {
      localStorage.removeItem(DRAFT_KEY);
    } else {
      draft.mode = currentMode;
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    }
  } catch (e) {}
}

function clearCurrentHtml() {
  if (!confirm('确定要清空当前 HTML 代码和解析结果吗？')) return;

  originalCode = '';
  parsedConfig = {};
  generatedCode = '';

  // 注意：如果当前是播放器/IG/iMessage，这里清掉类型，避免残留
  configVarName = '';
  configType = '';
  activeEditSectionKey = '';
  activeEditFieldKey = '';


  const input = document.getElementById('inputCode');
  if (input) input.value = '';

  const formFields = document.getElementById('formFields');
  if (formFields) formFields.innerHTML = '';

  const htmlPreviewArea = document.getElementById('htmlPreviewArea');
  if (htmlPreviewArea) htmlPreviewArea.innerHTML = '';

  const previewFrame = document.getElementById('previewFrame');
  if (previewFrame) previewFrame.srcdoc = '';

  document.getElementById('formSection').classList.remove('active');
  document.getElementById('outputSection').classList.remove('active');

  setFabMode(false);
  updateDraftAfterClear('html');
  showToast('✅ 当前 HTML 已清空');
}

function clearCurrentRegex() {
  if (!confirm('确定要清除当前导入的正则和编辑内容吗？')) return;

  regexData = null;
  regexOriginalHtml = '';
  regexParsedConfig = {};
  regexGeneratedJson = '';

  configVarName = '';
  configType = '';
  activeEditSectionKey = '';
  activeEditFieldKey = '';

  const fileInput = document.getElementById('regexFileInput');
  if (fileInput) fileInput.value = '';

  const regexFormFields = document.getElementById('regexFormFields');
  if (regexFormFields) regexFormFields.innerHTML = '';

  const regexPreviewArea = document.getElementById('regexPreviewArea');
  if (regexPreviewArea) regexPreviewArea.innerHTML = '';

  const info = document.getElementById('regexInfoDisplay');
  if (info) info.innerHTML = '';

  document.getElementById('regexEditCard').classList.remove('active');
  document.getElementById('regexOutputCard').classList.remove('active');

  setFabMode(false);
  updateDraftAfterClear('regex');
  showToast('✅ 当前正则已清除');
}

function reset() {
  originalCode = '';
  parsedConfig = {};
  generatedCode = '';
  configVarName = '';
  configType = '';
  document.getElementById('inputCode').value = '';
  document.getElementById('formSection').classList.remove('active');
  document.getElementById('outputSection').classList.remove('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
updateDraftAfterClear('html');
}
</script>
